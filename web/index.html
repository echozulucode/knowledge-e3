<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Pre-hydration branding fallback only. A tenant's own name and favicon come
      from `GET /api/v1/site` and are applied by `useSiteChrome`
      (web/src/components/shell/SiteBrand.tsx) as soon as the app mounts; these
      literals are what a visitor sees for the first frame, and are the whole
      answer on an instance that configures no `site:` block. Keep them in step
      with SITE_DEFAULTS in web/src/components/shell/siteBranding.ts.
    -->
    <link rel="icon" type="image/png" href="/logo/ke3-cube-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/logo/ke3-cube-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/logo/ke3-cube-light.png" />
    <title>Knowledge × 10³</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
