# Knowledge E3 — turnkey self-host.
#
#   cp .env.example .env      # then set SEED_ADMIN_PASSWORD (and edit as needed)
#   docker compose up -d      # build + run; the first boot creates that admin
#   # open http://localhost:3000 and sign in with SEED_ADMIN_USERNAME / *_PASSWORD
#
# One container serves both the JSON API and the built web UI on port 3000.
# All state lives on the `kp_data` volume mounted at /data:
#   /data/kp.sqlite   the derived index (rebuildable from the mirror)
#   /data/wiki        the git-of-record Markdown mirror + uploaded media (ADR-0001)
# Back up that volume and you have backed up everything. SQLite is the only
# supported store (ADR-0002). Full walk-through: docs/self-hosting.md.

services:
  # Production-built app + web UI, backed by SQLite on a persistent volume.
  # NODE_ENV is development only so the loopback HTTP quickstart can set its
  # session cookie (the Secure flag is on in production, and a browser drops a
  # Secure cookie over plain HTTP). TLS deployments set NODE_ENV=production and
  # HTTPS_ONLY=1 in .env or at the platform boundary.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: knowledge-e3
    container_name: knowledge-e3-app
    restart: unless-stopped
    # Every variable in .env reaches the container as-is.
    #
    # WHY env_file rather than one `environment:` line per variable: each source
    # names its OWN credential variable (Admin -> Sources -> "Host token env
    # var"), so the set is open-ended — listing them here would mean editing
    # this file, which is committed, every time a source is added. It also keeps
    # the values out of the compose model: an `environment: FOO: "${FOO}"` entry
    # is interpolated at parse time, so the token itself is what
    # `docker compose config` prints, while an env_file is a path the runtime
    # reads. The explicit entries below stay because they have DEFAULTS this
    # file supplies; .env still overrides any of them.
    #
    # `required: false` needs Compose v2.24+; on an older Compose drop that line
    # and keep `- .env` (and then the file must exist).
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: "${NODE_ENV:-development}"
      HTTPS_ONLY: "${HTTPS_ONLY:-0}"
      PORT: "3000"
      DB_URL: "/data/kp.sqlite"
      GIT_MIRROR_ROOT: "/data/wiki"
      # First-run admin bootstrap, run by the entrypoint. Idempotent, and skipped
      # entirely when the password is unset (seed by hand then — see .env.example).
      SEED_ADMIN_USERNAME: "${SEED_ADMIN_USERNAME:-admin}"
      SEED_ADMIN_EMAIL: "${SEED_ADMIN_EMAIL:-admin@local}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:-}"
      # 'public' (the default) lets anonymous visitors read published content in
      # public topics; 'authenticated' requires a sign-in even to read.
      KNOWLEDGE_E3_DEFAULT_READ_ACCESS: "${KNOWLEDGE_E3_DEFAULT_READ_ACCESS:-}"
      # Behind TLS, name your public origin here or the CSRF guard rejects
      # browser mutations from it with a 403.
      KNOWLEDGE_E3_ALLOWED_ORIGINS: "${KNOWLEDGE_E3_ALLOWED_ORIGINS:-}"
      # Proxy hops allowed to report the client address; without it the per-IP
      # sign-in throttle sees one address for every client behind the proxy.
      TRUST_PROXY: "${TRUST_PROXY:-}"
      # Git credentials are NOT listed here: a source names its own variable
      # (Admin -> Sources -> "Host token env var") and env_file above carries it,
      # along with the optional instance-wide GIT_HTTPS_TOKEN fallback. See
      # .env.example and docs/self-hosting.md.
      GIT_AUTHOR_NAME: "${GIT_AUTHOR_NAME:-Knowledge E3}"
      GIT_AUTHOR_EMAIL: "${GIT_AUTHOR_EMAIL:-knowledge-e3@users.noreply.github.com}"
      # SQLite WAL breaks on SMB/NFS/Azure-Files mounts — set DELETE there.
      SQLITE_JOURNAL_MODE: "${SQLITE_JOURNAL_MODE:-WAL}"
    ports:
      # Loopback by default: an instance is not exposed to the network until the
      # operator says so, which is the safe default for `docker compose up` on a
      # machine that has no TLS in front of it yet.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    volumes:
      - kp_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/v1/healthz',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  kp_data:
    driver: local
