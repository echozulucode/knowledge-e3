name: Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Least privilege: the job only needs to read repo contents. This also caps the
# scope of the GITHUB_TOKEN that untrusted PR code runs alongside.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        # No `version:` here — the action reads `packageManager` from
        # package.json (currently pnpm@9.15.0). Specifying both would error
        # with ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        # The editor packages (@echozedlabs/*) are now consumed from npm, so no
        # cross-repo checkout is needed — a plain install resolves everything.
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        # @echozedlabs/codec's package.json points main/types at ./dist, so consuming
        # packages (server, web) need it built before their tsc can resolve
        # `@echozedlabs/codec`. `pnpm -r build` walks workspace deps in topological order.
        run: pnpm -r build

      - name: Type check
        run: pnpm -r typecheck

      - name: Lint
        # Catches the class of bug tsc cannot: conditional/after-early-return
        # React Hook calls, which only surface at runtime. Config is narrow on
        # purpose (see web/eslint.config.js).
        run: pnpm -r lint

      - name: Run tests
        run: pnpm -r test

  # Separate job: e2e boots a real server + Vite and is slower than the unit
  # suite, so a failure here should be distinguishable at a glance. It runs
  # every spec NOT tagged @quarantine -- see docs/e2e-quarantine.md for why
  # specs get quarantined and how to bring one back.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r build

      - name: Install Playwright browser
        run: pnpm test:e2e:install

      - name: Run e2e (non-quarantined)
        run: pnpm --filter @echozedlabs/web test:e2e:ci

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
